---
layout: page
title: Chủ đề
kicker: Theo thẻ
seal: CHỦ ĐỀ
wide: true
---
{% assign tags = site.tags | sort %}
<p class="tag-cloud">
  {% for t in tags %}<a href="#{{ t[0] | slugify }}">{{ t[0] }} <sup>{{ t[1].size }}</sup></a>{% endfor %}
</p>
{% for t in tags %}
<p class="year-label" id="{{ t[0] | slugify }}">{{ t[0] }}</p>
<ul class="post-list">
  {% for post in t[1] %}{% include post-row.html post=post %}{% endfor %}
</ul>
{% endfor %}
