<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — trang chủ">
      {% include seal.html %}
      <span class="brand-name">{{ site.title }}</span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Mở menu">
      <span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav">
      <a href="{{ '/portfolio/' | relative_url }}" {% if page.url contains '/portfolio/' or page.layout == 'project' %}aria-current="page"{% endif %}>Dự án</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' or page.layout == 'post' %}aria-current="page"{% endif %}>Bài viết</a>
      <a href="{{ '/tags/' | relative_url }}" {% if page.url contains '/tags/' %}aria-current="page"{% endif %}>Chủ đề</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about/' %}aria-current="page"{% endif %}>Giới thiệu</a>
      <button class="theme-toggle" type="button" aria-label="Đổi giao diện sáng/tối">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </nav>
  </div>
</header>
